name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # run every version even if one fails, so a failure shows its real cause
      fail-fast: false
      matrix:
        # Python 3.9 is end-of-life and has no build for ubuntu-latest (26.04)
        python-version: ["3.10", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and elastic-vis (optional, from GitHub)
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install "git+https://github.com/prabhat7iitm/elastic-vis.git"

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -v

  # Publish to PyPI when a GitHub Release is published (trusted publishing: no token stored).
  # One-time setup on pypi.org: add a "pending publisher" for project elastic-ase with
  # owner prnvrvs, repository elastic_ase, workflow ci.yml, environment pypi.
  publish-pypi:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Build and check the distribution
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        python -m twine check --strict dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
