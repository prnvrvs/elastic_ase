name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # run every version even if one fails, so a failure shows its real cause
      fail-fast: false
      matrix:
        # Python 3.9 is end-of-life and has no build for ubuntu-latest (26.04)
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        elastic-vis: [true]
        include:
          # how a PyPI user installs it: without the optional elastic-vis
          - python-version: "3.13"
            elastic-vis: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Install elastic-vis (optional, from GitHub)
      if: matrix.elastic-vis
      run: pip install "git+https://github.com/prabhat7iitm/elastic-vis.git"

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -v

  # Publish to PyPI when a GitHub Release is published (trusted publishing: no token stored).
  # One-time setup on pypi.org: add a "pending publisher" for project elastic-ase with
  # owner prnvrvs, repository elastic_ase, workflow ci.yml, environment pypi.
  publish-pypi:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Check that the release tag matches the package version
      run: |
        version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('elastic_ase/__init__.py').read()).group(1))")
        if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
          echo "Release tag ${GITHUB_REF_NAME} does not match __version__ ${version}"; exit 1
        fi

    - name: Build and check the distribution
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        python -m twine check --strict dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
