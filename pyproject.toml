[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elastic-ase"
version = "0.0.1"
description = "Second-order elastic constants calculation and anisotropic visualization package for ASE"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Antigravity" }
]
dependencies = [
    "numpy",
    "pandas",
    "ase",
    "spglib",
    "elastic-vis"
]

[project.scripts]
elastic-ase = "elastic_ase.cli:main"
